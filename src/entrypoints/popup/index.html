<!doctype html>
<html lang="en" class="beat-popup-page">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Likes to Go</title>
		<meta
			name="manifest.default_icon"
			content='{"16": "/icons/16.png", "32": "/icons/32.png"}'
		/>
		<!--
			Earliest boot mark: with default_popup, chrome.action.onClicked does not fire.
			Document time origin ≈ toolbar click; compare to later "popup UI mounted" logs.
		-->
		<script>
			globalThis.__LikesToGoPopupBoot = {
				wallMs: Date.now(),
				perfMs: performance.now(),
			};
			console.info(
				'[likes-to-go] action popup document start',
				globalThis.__LikesToGoPopupBoot,
			);
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
